# Cybort configuration examples
#
# This file is intentionally fully commented out. Do not put real credentials
# in the repository. First initialize the default installation:
#
#   bundle exec bin/cybort init
#
# Then edit ~/.cybort/cybort.toml, uncomment only the instances you want, and
# replace every placeholder. You can keep multiple instances of one adapter
# with different stable IDs. Run a normal fetch with:
#
#   bundle exec bin/cybort
#
# Use --force-fetch when you want to ignore each instance's freshness TTL.
#
# Shared instance fields:
#   name                 Display name in CLI output.
#   adapter              Registered connector type.
#   ttl_minutes          Freshness window before a remote fetch is needed.
#   num_items_to_fetch   Per-fetch source/selection limit.
#   retention_ttl_minutes Optional local item retention window in minutes.
#                         Omit it to retain items forever. Pruning occurs only
#                         after a successful remote fetch.
#   hard_expiry_ttl_minutes Optional startup expiry window in minutes. When set,
#                           stale items are deleted before each run even if the
#                           source is unavailable. Omit it for last-known-good
#                           retention semantics.
#
# Keep this file free of access tokens, passwords, refresh tokens, and private
# URLs. See README.md for connector behavior, limits, and release caveats.

# schema_version = 1

# RSS: fetch a public RSS or Atom feed.
# [instances.personal_rss]
# name = "Personal RSS"
# adapter = "rss"
# ttl_minutes = 30
# retention_ttl_minutes = 10080 # 7 days; optional
# hard_expiry_ttl_minutes = 43200 # 30 days; optional hard local bound
# num_items_to_fetch = 25
# url = "https://example.com/feed.xml"

# GitHub: fetch notifications through the GitHub Notifications API.
# [instances.github]
# name = "GitHub Notifications"
# adapter = "github"
# ttl_minutes = 15
# num_items_to_fetch = 25
# api_url = "https://api.github.com/notifications" # optional; this is the default
# token = "replace-with-a-github-token"

# Reddit: fetch unread legacy inbox messages and activity-ranked threads.
# Obtain an approved OAuth refresh token outside Cybort. Chat is not included
# in V1. The user-agent must identify your application and Reddit user.
# [instances.personal_reddit]
# name = "Personal Reddit"
# adapter = "reddit"
# ttl_minutes = 15
# retention_ttl_minutes = 2880 # 48 hours is the documented Reddit default
# hard_expiry_ttl_minutes = 2880 # optional hard local bound
# num_items_to_fetch = 50
# client_id = "replace-with-reddit-client-id"
# client_secret = "replace-with-reddit-client-secret"
# refresh_token = "replace-with-reddit-refresh-token"
# user_agent = "macos:com.example.cybort:v0.1.0 (by /u/example_user)"
# include_subreddits = ["news", "programming"] # optional additions
# exclude_subreddits = ["memes"] # optional; exclusions win

# Gmail: direct read-only Gmail API; authorize once via README Gmail setup.
# The connector remains experimental until its authenticated smoke gate passes.
# Runtime does not execute gws or gcloud. Keep credentials outside the repo.
# Reddit RSS (experimental): public Atom feeds only; no OAuth, subscriptions,
# inbox/private messages, cookies, or credentials. This ranks a bounded,
# observed pool and replaces the selected snapshot only after all three feeds
# succeed. Confirm permitted access, ordering, and publication semantics before
# live use; use a new instance ID when changing the subreddit group.
# [instances.reddit_ruby_rails]
# name = "Ruby and Rails highlights"
# adapter = "reddit_rss"
# ttl_minutes = 15
# retention_ttl_minutes = 2880 # optional; 48 hours is a practical bound
# hard_expiry_ttl_minutes = 2880 # optional hard local bound
# num_items_to_fetch = 20
# subreddits = ["ruby", "rails"] # pooled universe; use another ID for another group
# user_agent = "macos:com.example.cybort:v0.1.0 (by /u/your_username)"
# activity_weights = { top = 550, rising = 300, momentum = 100, persistence = 50 }
# [instances.personal_gmail]
# name = "Personal Gmail"
# adapter = "gmail"
# ttl_minutes = 60
# num_items_to_fetch = 200 # integer 1..500; one bounded list page
# credentials_file = "~/.cybort/google-auth/personal_gmail/application_default_credentials.json"
# user_id = "me"
# query = "in:anywhere"
# include_spam_trash = true # optional; default false

# When adding a connector, update this template in the same change: add its
# commented instance shape, required fields, safe placeholder guidance, and any
# important limits or authentication caveats. Keep README.md linked to this
# file rather than copying configuration blocks into multiple documents.
